version: 2.1

parameters:
  # Set to true only by the auto-tag GitHub Action's API trigger (see
  # .github/workflows/auto-tag-release.yml). CircleCI's native tag webhook is
  # unreliable — it fires on some release tags and not others — so the API POST is
  # the real release trigger. Gating the release workflow on this parameter makes
  # the API-triggered pipeline the SINGLE deterministic release path: a webhook tag
  # pipeline arrives without the parameter (default false) and skips the release,
  # instead of racing the API pipeline and double-uploading the same build (ITMS-90189).
  run_release:
    type: boolean
    default: false

  # Set to true only by the nightly GitHub Action (.github/workflows/nightly-staging.yml),
  # which POSTs this pipeline on develop. Gates the nightly-staging workflow ON and gates the
  # ordinary lint/build-test workflows OFF, so a scheduled run does exactly one thing: build
  # the develop tip to the STAGING TestFlight app. An ordinary develop push lacks the
  # parameter (default false) and behaves as before.
  run_nightly_staging:
    type: boolean
    default: false

jobs:
  swiftlint_check:
    macos:
      xcode: 26.2
    resource_class: m4pro.medium
    steps:
      - checkout
      - run:
          name: Install Bundler
          command: gem install bundler
      - run:
          name: Install Fastlane
          command: bundle install
      - run:
          name: Install SwiftLint (pinned)
          command: |
            # Pinned deliberately: `brew install swiftlint` floats to latest, so a new
            # SwiftLint release adds rules and fails builds nobody touched. Keep this in
            # sync with the SwiftLintPlugins version in Package.resolved.
            SWIFTLINT_VERSION="$(cat .swiftlint-version)"
            curl -sSfL -o /tmp/swiftlint.zip \
              "https://github.com/realm/SwiftLint/releases/download/${SWIFTLINT_VERSION}/portable_swiftlint.zip"
            unzip -q -o /tmp/swiftlint.zip -d /tmp/swiftlint
            sudo install -m 0755 /tmp/swiftlint/swiftlint /usr/local/bin/swiftlint
            swiftlint version
      - run:
          name: Run SwiftLint via Fastlane
          command: bundle exec fastlane lint_code
      - run:
          name: Run Swift Format Check
          command: bundle exec fastlane format_check

  build-and-test:
    macos:
      xcode: 26.2
    resource_class: m4pro.medium
    environment:
      FL_OUTPUT_DIR: output
      FASTLANE_LANE: test
    steps:
      - checkout
      - run: brew install xcbeautify xcresultparser
      - run: cp ./PlayolaRadio/Config/Secrets-Example.xcconfig ./PlayolaRadio/Config/Secrets.xcconfig
      - run: cp ./PlayolaRadio/Config/Secrets-Example.xcconfig ./PlayolaRadio/Config/Secrets-Development.xcconfig
      - run: cp ./PlayolaRadio/Config/Secrets-Example.xcconfig ./PlayolaRadio/Config/Secrets-Local.xcconfig
      - run: cp ./PlayolaRadio/Config/Secrets-Example.xcconfig ./PlayolaRadio/Config/Secrets-Staging.xcconfig
      - run: bundle install
      - run:
          name: Resolve Swift Package Dependencies
          command: xcodebuild -resolvePackageDependencies -project PlayolaRadio.xcodeproj
      - run:
          name: Fastlane
          command: bundle exec fastlane $FASTLANE_LANE
      - store_artifacts:
          path: output
      - store_test_results:
          path: "./fastlane/test_output"
      - store_test_results:
          path: test-results

  release_build:
    macos:
      xcode: 26.2
    resource_class: m4pro.medium
    steps:
      - checkout
      - run:
          name: Set up SSH for match (fastlane-match-certs-and-profiles)
          command: |
            mkdir -p ~/.ssh
            chmod 700 ~/.ssh
            printf '%s' "$MATCH_GIT_PRIVATE_KEY_B64" | base64 --decode > ~/.ssh/id_rsa
            chmod 600 ~/.ssh/id_rsa
            ssh-keyscan github.com >> ~/.ssh/known_hosts
      - run:
          name: Install Bundler
          command: gem install bundler
      - run:
          name: Install Fastlane
          command: bundle install
      - run:
          name: Install xcbeautify and xcresultparser
          command: brew install xcbeautify xcresultparser
      - run:
          name: Decode xcconfig secrets
          command: bash scripts/ci-write-secrets.sh
      - run:
          name: Resolve Swift Package Dependencies
          command: xcodebuild -resolvePackageDependencies -project PlayolaRadio.xcodeproj
      - run:
          name: Fastlane release_production (build + upload to TestFlight + Sentry dSYMs)
          command: bundle exec fastlane release_production
      - store_artifacts:
          path: build
      - store_test_results:
          path: fastlane/test_output

  release_staging_build:
    macos:
      xcode: 26.2
    resource_class: m4pro.medium
    steps:
      - checkout
      - run:
          name: Set up SSH for match (fastlane-match-certs-and-profiles)
          command: |
            mkdir -p ~/.ssh
            chmod 700 ~/.ssh
            printf '%s' "$MATCH_GIT_PRIVATE_KEY_B64" | base64 --decode > ~/.ssh/id_rsa
            chmod 600 ~/.ssh/id_rsa
            ssh-keyscan github.com >> ~/.ssh/known_hosts
      - run:
          name: Install Bundler
          command: gem install bundler
      - run:
          name: Install Fastlane
          command: bundle install
      - run:
          name: Install xcbeautify and xcresultparser
          command: brew install xcbeautify xcresultparser
      - run:
          name: Decode xcconfig secrets
          command: bash scripts/ci-write-secrets.sh
      - run:
          name: Resolve Swift Package Dependencies
          command: xcodebuild -resolvePackageDependencies -project PlayolaRadio.xcodeproj
      - run:
          name: Fastlane release_staging (build + upload to staging TestFlight + Sentry dSYMs)
          command: bundle exec fastlane release_staging
      - store_artifacts:
          path: build

  adhoc:
    macos:
      xcode: 26.2
    resource_class: m4pro.medium
    environment:
      FL_OUTPUT_DIR: output
      FASTLANE_LANE: adhoc
    steps:
      - checkout
      - run: brew install xcbeautify
      - run: cp ./PlayolaRadio/Config/Secrets-Example.xcconfig ./PlayolaRadio/Config/Secrets.xcconfig
      - run: cp ./PlayolaRadio/Config/Secrets-Example.xcconfig ./PlayolaRadio/Config/Secrets-Development.xcconfig
      - run: cp ./PlayolaRadio/Config/Secrets-Example.xcconfig ./PlayolaRadio/Config/Secrets-Local.xcconfig
      - run: bundle install
      - run:
          name: Fastlane
          command: bundle exec fastlane $FASTLANE_LANE
      - store_artifacts:
          path: output
      - store_test_results:
          path: test-results

workflows:
  lint-codebase:
    # Skip on the nightly pipeline — it only builds the staging app, nothing to lint.
    when:
      not: << pipeline.parameters.run_nightly_staging >>
    jobs:
      - swiftlint_check

  build-test-adhoc:
    # Skip on the nightly pipeline so a scheduled run does exactly one thing (staging build).
    # develop is already kept green by per-PR CI, so re-running the full suite nightly is
    # redundant.
    when:
      not: << pipeline.parameters.run_nightly_staging >>
    jobs:
      - build-and-test
      - adhoc:
          filters:
            branches:
              only: development
          requires:
            - build-and-test

  nightly-staging:
    # Triggered only by .github/workflows/nightly-staging.yml, which POSTs this pipeline on
    # develop with run_nightly_staging: true. Builds the develop tip to the STAGING TestFlight
    # app (internal only — the release_staging lane sets distribute_external: false and
    # notify_external_testers: false). Reuses the same job as the release-time staging build.
    when: << pipeline.parameters.run_nightly_staging >>
    jobs:
      - release_staging_build:
          context: ios-release

  release:
    # Only run on the API-triggered pipeline that carries run_release: true. A native
    # tag webhook pipeline lacks the parameter and is skipped, so exactly one pipeline
    # per tag uploads a build. See the run_release parameter definition above.
    when: << pipeline.parameters.run_release >>
    jobs:
      - release_build:
          context: ios-release
          filters:
            tags:
              only: /^v.*/
            branches:
              ignore: /.*/
      - release_staging_build:
          context: ios-release
          requires:
            - release_build
          filters:
            tags:
              only: /^v.*/
            branches:
              ignore: /.*/
