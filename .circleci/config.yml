version: 2.1

# Setup config. A small Linux Docker job decides whether this pipeline needs the app checks, then
# continues the pipeline with .circleci/continue_config.yml (where every real job lives).
#
# - develop, main and release (run_release) pipelines always continue with build_app: true, so
#   they behave exactly as before. Nightly runs on develop, so it is covered too.
# - Any other branch runs lint and the Mac build-and-test only when its diff against develop
#   touches a path in the ALLOWLIST below. Anything not listed (docs, design/, changelog.d/,
#   .github/, App Store screenshots…) skips them. A new kind of build input must be added here,
#   so when in doubt, add the path.
setup: true

orbs:
  continuation: circleci/continuation@2.0.1
  path-filtering: circleci/path-filtering@3.0.0

# The GitHub Actions POST these when triggering a pipeline, so they must be declared here. See
# continue_config.yml for what they do and why they are not passed to the continue job.
parameters:
  run_release:
    type: boolean
    default: false
  run_nightly_staging:
    type: boolean
    default: false

always-build: &always-build
  or:
    # Release pipelines run on a tag, which has no branch.
    - << pipeline.parameters.run_release >>
    - equal: [develop, << pipeline.git.branch >>]
    - equal: [main, << pipeline.git.branch >>]

workflows:
  continue-full:
    when: *always-build
    jobs:
      - continuation/continue:
          resource_class: small
          configuration_path: .circleci/continue_config.yml
          parameters: '{"build_app": true}'
          # Release pipelines are tag pipelines; a job only runs on a tag when it has a
          # matching tag filter.
          filters:
            tags:
              only: /^v.*/

  continue-if-app-changed:
    when:
      not: *always-build
    jobs:
      - path-filtering/filter:
          resource_class: small
          base-revision: develop
          # ALLOWLIST: <path regex (anchored, grep -P)> <parameter> <value>
          mapping: |
            PlayolaRadio/.* build_app true
            PlayolaRadioTests/.* build_app true
            PlayolaRadio\.xcodeproj/.* build_app true
            LocalPackages/.* build_app true
            .*\.swift build_app true
            .*\.xcconfig build_app true
            .*\.plist build_app true
            .*\.entitlements build_app true
            .*\.xcassets/.* build_app true
            Gemfile build_app true
            Gemfile\.lock build_app true
            fastlane/(Fastfile|Appfile|Pluginfile|Matchfile) build_app true
            \.circleci/.* build_app true
            \.swiftlint\.yml build_app true
            \.swiftlint-version build_app true
            scripts/ci-write-secrets\.sh build_app true
