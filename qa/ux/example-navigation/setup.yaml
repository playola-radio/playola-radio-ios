appId: fm.playola.playolaradio.staging
---
# Open Radio Stations and dismiss the first-launch notification prompt ("No Thanks" only saves a local
# setting), so the recording starts on a settled stations list.
- tapOn: "Radio Stations"
- extendedWaitUntil:
    visible: "Stay in the Loop?"
    timeout: 60000
- tapOn: "No Thanks"
- extendedWaitUntil:
    visible: "Search stations"
    timeout: 30000
