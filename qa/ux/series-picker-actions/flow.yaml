appId: fm.playola.playolaradio.staging
---
# Creates a weekly series from the show builder, which saves the new show into it, then reopens
# the picker and takes the show back out of the series.
- tapOn: "Add to a series"
- extendedWaitUntil:
    visible: "New Series"
    timeout: 30000
- tapOn: "New Series"
- extendedWaitUntil:
    visible: "REPEATS"
    timeout: 30000
- tapOn: "Series name"
- inputText: "UX Evidence Series"
- hideKeyboard
- tapOn: "Tuesday"
- tapOn: "Thursday"
- tapOn: "Save"
- extendedWaitUntil:
    visible: "Change"
    timeout: 30000
- tapOn: "UX Evidence Series"
- extendedWaitUntil:
    visible: "Remove from UX Evidence Series"
    timeout: 30000
- tapOn: "Remove from UX Evidence Series"
- extendedWaitUntil:
    visible: "Add to a series"
    timeout: 30000
