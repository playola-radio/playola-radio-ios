appId: fm.playola.playolaradio.staging
---
# Opens the series picker and the New Series sheet, then cancels. Nothing is picked or saved.
- tapOn: "Add to a series"
# Earlier runs' Series stay on staging, so the New Series row can sit below the fold.
- scrollUntilVisible:
    element: "New Series"
    direction: DOWN
    timeout: 30000
- takeScreenshot: series-picker
- tapOn: "New Series"
- extendedWaitUntil:
    visible: "REPEATS"
    timeout: 30000
- takeScreenshot: new-series
- tapOn: "Cancel"
- extendedWaitUntil:
    visible: "Add to a series"
    timeout: 30000
