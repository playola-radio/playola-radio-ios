appId: fm.playola.playolaradio.staging
---
# Upcoming → Series: the cards show each Series' next three Shows and open slots. Creates a Series
# with no schedule (its card appears, with "No upcoming shows."), opens its page (both empty-section
# messages) and its Edit Series (clearing the name disables Save; Cancel). Then opens the weekly
# Series' page (drafts, Shows, open slots, a twice-airing Show listed once) and edits its schedule:
# Save is disabled with no day, then saving Wednesday and Sunday updates the badge and slots.
- tapOn: "Series"
- extendedWaitUntil:
    visible: "Create a New Series"
    timeout: 30000
- scrollUntilVisible:
    element: "2 shows · 1 open"
    direction: DOWN
- tapOn: "Create a New Series"
- extendedWaitUntil:
    visible: "REPEATS"
    timeout: 30000
- tapOn: "Series name"
- inputText: "Porch Sessions"
- tapOn: "No schedule"
- tapOn: "Save"
- scrollUntilVisible:
    element: "Porch Sessions"
    direction: DOWN
- scrollUntilVisible:
    element: "No upcoming shows."
    direction: DOWN
- tapOn: "Porch Sessions"
- extendedWaitUntil:
    visible: "No drafts in this series."
    timeout: 30000
- assertVisible: "No upcoming shows."
- tapOn: "Edit"
- extendedWaitUntil:
    visible: "Edit Series"
    timeout: 30000
- tapOn:
    below: "NAME"
- eraseText: 30
- assertVisible:
    text: "Save"
    enabled: false
- tapOn: "Cancel"
- tapOn: "Series"
- extendedWaitUntil:
    visible: "Create a New Series"
    timeout: 30000
- scrollUntilVisible:
    element: "This One.s For You"
    direction: UP
- tapOn: "This One.s For You"
- extendedWaitUntil:
    visible: "NOT SCHEDULED YET"
    timeout: 30000
- extendedWaitUntil:
    visible: "Hymn Request Night"
    timeout: 30000
# A previous run leaves the schedule on Wednesday and Sunday; put it back to Sundays first.
- runFlow:
    when:
      visible: "Every Wednesday and Sunday at 7pm"
    commands:
      - tapOn: "Edit"
      - extendedWaitUntil:
          visible: "Edit Series"
          timeout: 30000
      - tapOn: "Wednesday"
      - tapOn: "Save"
      - extendedWaitUntil:
          visible: "Every Sunday at 7pm"
          timeout: 30000
- scrollUntilVisible:
    element: "Christmas Hymns"
    direction: DOWN
- tapOn: "Edit"
- extendedWaitUntil:
    visible: "Edit Series"
    timeout: 30000
- tapOn: "Sunday"
- assertVisible:
    text: "Save"
    enabled: false
- tapOn: "Wednesday"
- tapOn: "Sunday"
- tapOn: "Save"
- extendedWaitUntil:
    visible: "Every Wednesday and Sunday at 7pm"
    timeout: 30000
- scrollUntilVisible:
    element: "Wednesday · 7:00 PM"
    direction: DOWN
