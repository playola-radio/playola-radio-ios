appId: fm.playola.playolaradio.staging
---
- extendedWaitUntil:
    visible: "Search stations"
    timeout: 30000
- tapOn: "Search stations"
- inputText: "a"
- takeScreenshot: station-search-with-clear-button
- eraseText
- hideKeyboard
- extendedWaitUntil:
    visible: "Don't see your artist? Suggest a station"
    timeout: 30000
- tapOn:
    point: "50%,40%"
- extendedWaitUntil:
    visible: "NOW PLAYING"
    timeout: 60000
- takeScreenshot: player-header
